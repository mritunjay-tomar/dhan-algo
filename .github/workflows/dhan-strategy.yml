name: Dhan strategy

on:
  workflow_dispatch:
  schedule:
    # TEMPORARY DEBUG: every 5 minutes (GitHub's minimum), all days/hours.
    # Restore the original schedule after debugging:
    #   - cron: '46 3-9 * * 1-5'
    #   - cron: '16 4-9 * * 1-5'
    - cron: '2-59/5 * * * *'


permissions:
  contents: read

# Scheduled and manual cycles must not run concurrently in this repository.
concurrency:
  group: dhan-strategy
  cancel-in-progress: false

jobs:
  run-strategy:
    runs-on: self-hosted
    environment: main
    timeout-minutes: 10
    env:
      TZ: Asia/Kolkata
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Debug - trigger and runner context
        run: |
          echo "event:       ${{ github.event_name }}"
          echo "schedule:    ${{ github.event.schedule }}"
          echo "ref:         ${{ github.ref }}"
          echo "default br:  ${{ github.event.repository.default_branch }}"
          echo "actor:       ${{ github.actor }}"
          echo "runner:      ${{ runner.name }} (${{ runner.os }}/${{ runner.arch }})"
          echo "UTC now:     $(date -u)"
          echo "IST now:     $(TZ=Asia/Kolkata date)"
          which python python3 || true
          python --version || python3 --version || true

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run main.py
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          NIFTY_SECURITY_ID: ${{ vars.NIFTY_SECURITY_ID || '15' }}
          NIFTY_EXCHANGE_SEGMENT: ${{ vars.NIFTY_EXCHANGE_SEGMENT || 'IDX_I' }}
          NIFTY_INSTRUMENT: ${{ vars.NIFTY_INSTRUMENT || 'INDEX' }}
          NIFTY_OPTION_UNDERLYING_SECURITY_ID: ${{ vars.NIFTY_OPTION_UNDERLYING_SECURITY_ID || '13' }}
          # Required positive integer inputs. The runner sends lots × lot_size units to Dhan.
          NIFTY_QUANTITY: ${{ vars.NIFTY_QUANTITY }}
          NIFTY_LOT_SIZE: ${{ vars.NIFTY_LOT_SIZE }}
          SUPERTREND_ATR_PERIOD: ${{ vars.SUPERTREND_ATR_PERIOD || '22' }}
          SUPERTREND_MULTIPLIER: ${{ vars.SUPERTREND_MULTIPLIER || '4' }}
          SUPERTREND_LOOKBACK_DAYS: ${{ vars.SUPERTREND_LOOKBACK_DAYS || '60' }}
          DHAN_REQUEST_TIMEOUT_SECONDS: ${{ vars.DHAN_REQUEST_TIMEOUT_SECONDS || '15' }}
          # Required repository variables. main.py rejects missing or empty values.
          # Live orders require DRY_RUN=false and LIVE_TRADING_ENABLED=true.
          DRY_RUN: ${{ vars.DRY_RUN }}
          LIVE_TRADING_ENABLED: ${{ vars.LIVE_TRADING_ENABLED }}
        run: python main.py

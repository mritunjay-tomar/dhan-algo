name: Dhan strategy

on:
  workflow_dispatch:
  schedule:
    # 09:16 through 14:46 IST (03:46 through 09:16 UTC) every 30 mins, Mon–Fri
    - cron: '46 3-8 * * 1-5'
    - cron: '16 4-9 * * 1-5'

    # Final cycle at 15:16 IST (09:46 UTC), Mon–Fri
    - cron: '46 9 * * 1-5'

permissions:
  contents: read

# Scheduled and manual cycles must not run concurrently in this repository.
concurrency:
  group: dhan-strategy
  cancel-in-progress: false

jobs:
  run-strategy:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      TZ: Asia/Kolkata
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run main.py
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          NIFTY_SECURITY_ID: ${{ vars.NIFTY_SECURITY_ID || '15' }}
          NIFTY_EXCHANGE_SEGMENT: ${{ vars.NIFTY_EXCHANGE_SEGMENT || 'IDX_I' }}
          NIFTY_INSTRUMENT: ${{ vars.NIFTY_INSTRUMENT || 'INDEX' }}
          NIFTY_OPTION_UNDERLYING_SECURITY_ID: ${{ vars.NIFTY_OPTION_UNDERLYING_SECURITY_ID || '13' }}
          # Number of lots; the shared strategy fetches lot size and converts to units.
          NIFTY_QUANTITY: ${{ vars.NIFTY_QUANTITY || '1' }}
          SUPERTREND_ATR_PERIOD: ${{ vars.SUPERTREND_ATR_PERIOD || '22' }}
          SUPERTREND_MULTIPLIER: ${{ vars.SUPERTREND_MULTIPLIER || '4' }}
          SUPERTREND_LOOKBACK_DAYS: ${{ vars.SUPERTREND_LOOKBACK_DAYS || '60' }}
          DHAN_REQUEST_TIMEOUT_SECONDS: ${{ vars.DHAN_REQUEST_TIMEOUT_SECONDS || '15' }}
          # Manual and scheduled runs both use repository variables.
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          LIVE_TRADING_ENABLED: ${{ vars.LIVE_TRADING_ENABLED || 'false' }}
        run: python main.py

name: Dhan strategy

on:
  workflow_dispatch:
  schedule:
    # 09:16 through 15:16 IST (03:46 through 09:46 UTC) every 30 mins, Mon-Fri
    - cron: '46 3-9 * * 1-5'
    - cron: '16 4-9 * * 1-5'

permissions:
  contents: read

# Scheduled and manual cycles must not run concurrently in this repository.
concurrency:
  group: dhan-strategy
  cancel-in-progress: false

jobs:
  run-strategy:
    runs-on: self-hosted
    environment: main
    timeout-minutes: 10
    env:
      TZ: Asia/Kolkata
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Token cache: the key changes every 12 hours, so a cached token is at most ~12h old
      # (Dhan tokens are valid for 24h).
      - name: Compute 12-hour token cache bucket
        id: bucket
        run: echo "value=$(( $(date -u +%s) / 43200 ))" >> "$GITHUB_OUTPUT"

      - name: Restore Dhan access token cache
        id: token-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dhan_token/token.txt
          key: dhan-token-${{ steps.bucket.outputs.value }}

      - name: Generate Dhan access token (cache miss)
        if: steps.token-cache.outputs.cache-hit != 'true'
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          DHAN_REQUEST_TIMEOUT_SECONDS: ${{ vars.DHAN_REQUEST_TIMEOUT_SECONDS || '15' }}
          TOKEN_FILE: ${{ runner.temp }}/dhan_token/token.txt
        run: |
          mkdir -p "$(dirname "$TOKEN_FILE")"
          python - <<'PY'
          import os
          from pathlib import Path
          from dhan_algo.auth import generate_access_token
          token = generate_access_token(
              os.environ["CLIENT_ID"],
              os.environ["DHAN_PIN"],
              os.environ["DHAN_TOTP_SECRET"],
              float(os.environ["DHAN_REQUEST_TIMEOUT_SECONDS"]),
          )
          path = Path(os.environ["TOKEN_FILE"])
          path.write_text(token)
          path.chmod(0o600)
          PY

      - name: Save Dhan access token cache
        if: steps.token-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/dhan_token/token.txt
          key: dhan-token-${{ steps.bucket.outputs.value }}

      - name: Export Dhan access token
        env:
          TOKEN_FILE: ${{ runner.temp }}/dhan_token/token.txt
        run: |
          token="$(cat "$TOKEN_FILE")"
          echo "::add-mask::$token"
          echo "DHAN_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Run main.py
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          NIFTY_SECURITY_ID: ${{ vars.NIFTY_SECURITY_ID || '15' }}
          NIFTY_EXCHANGE_SEGMENT: ${{ vars.NIFTY_EXCHANGE_SEGMENT || 'IDX_I' }}
          NIFTY_INSTRUMENT: ${{ vars.NIFTY_INSTRUMENT || 'INDEX' }}
          NIFTY_OPTION_UNDERLYING_SECURITY_ID: ${{ vars.NIFTY_OPTION_UNDERLYING_SECURITY_ID || '13' }}
          # Required positive integer inputs. The runner sends lots × lot_size units to Dhan.
          NIFTY_QUANTITY: ${{ vars.NIFTY_QUANTITY }}
          NIFTY_LOT_SIZE: ${{ vars.NIFTY_LOT_SIZE }}
          SUPERTREND_ATR_PERIOD: ${{ vars.SUPERTREND_ATR_PERIOD || '22' }}
          SUPERTREND_MULTIPLIER: ${{ vars.SUPERTREND_MULTIPLIER || '4' }}
          SUPERTREND_LOOKBACK_DAYS: ${{ vars.SUPERTREND_LOOKBACK_DAYS || '60' }}
          DHAN_REQUEST_TIMEOUT_SECONDS: ${{ vars.DHAN_REQUEST_TIMEOUT_SECONDS || '15' }}
          # Required repository variables. main.py rejects missing or empty values.
          # Live orders require DRY_RUN=false and LIVE_TRADING_ENABLED=true.
          DRY_RUN: ${{ vars.DRY_RUN }}
          LIVE_TRADING_ENABLED: ${{ vars.LIVE_TRADING_ENABLED }}
        run: python main.py

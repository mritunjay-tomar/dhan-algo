name: Refresh Dhan access token

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. 02:30 UTC is 08:00 IST.
    - cron: '30 2 * * 1-5'

permissions:
  contents: read

concurrency:
  group: dhan-token-refresh
  cancel-in-progress: false

jobs:
  refresh-token:
    runs-on: self-hosted
    environment: main
    timeout-minutes: 10
    env:
      TZ: Asia/Kolkata
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate Dhan access token
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          DHAN_REQUEST_TIMEOUT_SECONDS: ${{ vars.DHAN_REQUEST_TIMEOUT_SECONDS || '15' }}
        run: |
          token="$(python - <<'PY'
          import os
          from dhan_algo.auth import generate_access_token

          print(generate_access_token(
              os.environ["CLIENT_ID"],
              os.environ["DHAN_PIN"],
              os.environ["DHAN_TOTP_SECRET"],
              float(os.environ["DHAN_REQUEST_TIMEOUT_SECONDS"]),
          ))
          PY
          )"
          echo "::add-mask::$token"
          echo "DHAN_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Store token in the main environment secret
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_UPDATE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_SECRET_UPDATE_TOKEN is required to update Actions secrets." >&2
            exit 1
          fi
          printf '%s' "$DHAN_ACCESS_TOKEN" | gh secret set DHAN_ACCESS_TOKEN \
            --env main \
            --repo "$GITHUB_REPOSITORY"
